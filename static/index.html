<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edumerge Support Desk</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--primary:#315efb;--line:#e6eaf0;--danger:#dc3545;--success:#159957;--warn:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3ff,#f8fafc)}.login-card{width:min(430px,92vw);background:#fff;padding:34px;border-radius:20px;box-shadow:0 18px 60px #24345c18}.brand{font-weight:800;font-size:24px;margin-bottom:7px}.muted{color:var(--muted)}label{font-size:13px;font-weight:650;display:block;margin:15px 0 7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #315efb18}.primary{background:var(--primary);color:#fff;border:0;padding:11px 15px;border-radius:10px;font-weight:700}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 13px;border-radius:10px;font-weight:650}.danger{color:#b42318;background:#fff;border:1px solid #f3c4c7;padding:9px 12px;border-radius:9px}.app{display:none;min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.top .brand{font-size:19px}.userbox{display:flex;gap:12px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#e9efff;color:#315efb;display:grid;place-items:center;font-weight:800}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 12px}nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 13px;border-radius:9px;color:#596274;margin-bottom:5px}nav button.active,nav button:hover{background:#eef3ff;color:#315efb;font-weight:700}main{padding:28px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.page-head h1{font-size:25px;margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:6px}.content-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.card h3{margin:0 0 15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:650}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#eef2f7}.pill.open{background:#eef3ff;color:#315efb}.pill.progress{background:#fff4df;color:#a65d00}.pill.pending{background:#f1edff;color:#6d4bc3}.pill.resolved,.pill.closed{background:#eaf8f0;color:#117744}.pill.critical{background:#ffe9eb;color:#b42318}.pill.high{background:#fff0e6;color:#b45309}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{max-width:280px}.ticket-row{cursor:pointer}.ticket-row:hover{background:#fafbfe}.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-box{background:#fff;width:min(850px,96vw);max-height:90vh;overflow:auto;border-radius:17px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:start}.close{border:0;background:#f1f3f7;border-radius:50%;width:34px;height:34px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.activity{border-left:2px solid #e5e9f0;padding-left:15px;margin:13px 0}.activity b{font-size:13px}.activity small{display:block;color:var(--muted);margin-top:3px}.empty{padding:35px;text-align:center;color:var(--muted)}.error{color:#b42318;background:#fff0f1;border:1px solid #ffd2d5;padding:10px;border-radius:9px;margin-top:12px;display:none}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:20}.demo{font-size:12px;background:#f8fafc;padding:10px;border-radius:9px;margin-top:15px;line-height:1.6}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}main{padding:18px}.top{padding:0 15px}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.page-head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand">Edumerge Support Desk</div><div class="muted">Student Support & Ticket Management</div><form id="loginForm"><label>Email</label><input id="email" value="admin@edumerge.com" required><label>Password</label><input id="password" type="password" value="admin123" required><button class="primary" style="width:100%;margin-top:18px">Sign in</button><div id="loginErr" class="error"></div></form><div class="demo"><b>Demo accounts</b><br>Admin: admin@edumerge.com / admin123<br>Staff: staff@edumerge.com / staff123<br>Student: student@edumerge.com / student123</div></div></div>
<div id="app" class="app"><header class="top"><div class="brand">Edumerge Support Desk</div><div class="userbox"><div id="userName"></div><div class="avatar" id="avatar">A</div><button class="secondary" onclick="logout()">Logout</button></div></header><div class="layout"><aside><nav><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="tickets">▤ Tickets</button><button data-page="create">＋ New Ticket</button><button data-page="about">ⓘ Product Notes</button></nav></aside><main id="main"></main></div></div><div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><div id="toast" class="toast"></div>
<script>
const state={token:localStorage.getItem('ed_token'),user:null,page:'dashboard'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(state.token?{Authorization:'Bearer '+state.token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function pill(s){return `<span class="pill ${s.toLowerCase().replaceAll(' ','-')}">${esc(s)}</span>`}
function fmt(s){return new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function showApp(){ $('login').style.display='none';$('app').style.display='block';$('userName').textContent=state.user.name+' · '+state.user.role;$('avatar').textContent=state.user.name[0].toUpperCase();render() }
async function boot(){if(!state.token)return;try{state.user=await api('/api/me');showApp()}catch{logout()}}
function logout(){localStorage.removeItem('ed_token');state.token=null;state.user=null;$('app').style.display='none';$('login').style.display='grid'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').style.display='none';try{let d=await api('/api/login',{method:'POST',body:{email:$('email').value,password:$('password').value}});state.token=d.token;state.user=d.user;localStorage.setItem('ed_token',state.token);showApp()}catch(e){$('loginErr').textContent=e.message;$('loginErr').style.display='block'}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;setActiveNav();render()});
function setActiveNav(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page))}
async function render(){setActiveNav();if(state.page==='dashboard')return dashboard();if(state.page==='tickets')return tickets();if(state.page==='create')return create();return about()}
async function dashboard(){if(state.user.role==='student'){state.page='tickets';return tickets()}let d=await api('/api/dashboard');$('main').innerHTML=`<div class="page-head"><div><h1>Dashboard</h1><div class="muted">Service health, workload and SLA visibility</div></div><button class="primary" onclick="state.page='tickets';render()">View tickets</button></div><div class="grid"><div class="stat"><small>Total tickets</small><strong>${d.total}</strong></div><div class="stat"><small>Open / active</small><strong>${d.counts.Open+d.counts['In Progress']+d.counts.Pending}</strong></div><div class="stat"><small>SLA breached</small><strong>${d.sla_breached}</strong></div><div class="stat"><small>Unassigned</small><strong>${d.unassigned}</strong></div></div><div class="content-grid"><div class="card"><h3>Ticket status</h3><div class="table-wrap"><table class="table"><tr><th>Status</th><th>Count</th></tr>${Object.entries(d.counts).map(([k,v])=>`<tr><td>${pill(k)}</td><td>${v}</td></tr>`).join('')}</table></div></div><div class="card"><h3>Operations</h3><p class="muted">High / critical active tickets</p><strong style="font-size:32px">${d.high_priority_open}</strong><p class="muted">Average resolution: ${d.avg_resolution_hours??'—'} hours</p><p class="muted">SLA is calculated from category SLA hours and ticket creation time.</p></div></div>`}
async function tickets(){let rows=await api('/api/tickets');$('main').innerHTML=`<div class="page-head"><div><h1>Tickets</h1><div class="muted">${state.user.role==='student'?'Your support requests':'All support requests and workload'}</div></div>${state.user.role==='student'?'<button class="primary" onclick="state.page=\'create\';render()">＋ New Ticket</button>':''}</div><div class="card"><div class="toolbar"><input id="search" placeholder="Search ticket number or title…"><select id="sf"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Pending</option><option>Resolved</option><option>Closed</option></select><select id="pf"><option value="">All priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Ticket</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th><th>Owner</th><th>SLA</th></tr></thead><tbody id="ticketBody"></tbody></table></div></div>`;let draw=()=>{let q=$('search').value.toLowerCase(),sf=$('sf').value,pf=$('pf').value;let x=rows.filter(t=>(!q||(t.ticket_no+t.title).toLowerCase().includes(q))&&(!sf||t.status===sf)&&(!pf||t.priority===pf));$('ticketBody').innerHTML=x.length?x.map(t=>`<tr class="ticket-row" onclick="openTicket(${t.id})"><td><b>${t.ticket_no}</b></td><td>${esc(t.title)}</td><td>${esc(t.category)}</td><td>${pill(t.priority)}</td><td>${pill(t.status)}</td><td>${esc(t.assignee?.name||'Unassigned')}</td><td>${t.sla_breached?'<span style="color:#b42318;font-weight:750">BREACHED</span>':'<span style="color:#159957">On track</span>'}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">No tickets found.</td></tr>`};['search','sf','pf'].forEach(id=>$(id).oninput=draw);draw()}
async function create(){let cats=await api('/api/categories');$('main').innerHTML=`<div class="page-head"><div><h1>Create Ticket</h1><div class="muted">Raise a request for the student services team</div></div></div><div class="card" style="max-width:860px"><form id="createForm"><label>Subject</label><input id="ctitle" placeholder="e.g. Attendance correction request" required><label>Category</label><select id="ccat">${cats.map(c=>`<option value="${c.id}">${c.name} · SLA ${c.default_sla_hours}h</option>`).join('')}</select><label>Priority</label><select id="cpri"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select><label>Description</label><textarea id="cdesc" rows="7" placeholder="Describe the issue and any relevant details…" required></textarea><div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><button type="button" class="secondary" onclick="state.page='tickets';render()">Cancel</button><button class="primary" type="submit">Create Ticket</button></div><div id="createErr" class="error"></div></form></div>`;$('createForm').onsubmit=async e=>{e.preventDefault();$('createErr').style.display='none';try{let t=await api('/api/tickets',{method:'POST',body:{title:$('ctitle').value.trim(),description:$('cdesc').value.trim(),category_id:+$('ccat').value,priority:$('cpri').value}});showCreated(t)}catch(e){$('createErr').textContent=e.message;$('createErr').style.display='block'}}}

function showCreated(t){
  $('main').innerHTML=`<div class="page-head"><div><h1>Ticket Created</h1><div class="muted">Your request has been submitted to the student services team.</div></div></div><div class="card" style="max-width:760px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div style="width:42px;height:42px;border-radius:50%;background:#eaf8f0;color:#117744;display:grid;place-items:center;font-weight:800;font-size:20px">✓</div><div><h2 style="margin:0 0 4px">${esc(t.ticket_no)}</h2><div class="muted">Ticket created successfully</div></div></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px"><div class="stat"><small>Status</small><strong style="font-size:18px">${esc(t.status)}</strong></div><div class="stat"><small>Priority</small><strong style="font-size:18px">${esc(t.priority)}</strong></div><div class="stat"><small>SLA</small><strong style="font-size:18px">${esc(t.category||'Applied')}</strong></div></div><div style="display:flex;justify-content:flex-end;gap:10px"><button class="secondary" onclick="state.page='tickets';render()">View My Tickets</button><button class="primary" onclick="openTicket(${t.id})">View Ticket</button></div></div>`;toast('Ticket '+t.ticket_no+' created')}
async function openTicket(id){let t=await api('/api/tickets/'+id);$('modal').style.display='flex';let staff=state.user.role!=='student'?await api('/api/users'):[];$('modalBox').innerHTML=`<div class="modal-head"><div><div class="muted">${t.ticket_no} · ${t.category}</div><h2 style="margin:4px 0 8px">${esc(t.title)}</h2><div>${pill(t.priority)} ${pill(t.status)} ${t.sla_breached?'<span class="pill critical">SLA BREACHED</span>':''}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="two" style="margin-top:20px"><div><h3>Description</h3><p style="white-space:pre-wrap">${esc(t.description)}</p><p class="muted">Created ${fmt(t.created_at)} · Due ${fmt(t.due_at)}</p></div><div>${state.user.role!=='student'?`<label>Status</label><select id="ustatus">${['Open','In Progress','Pending','Resolved','Closed'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select><label>Priority</label><select id="upri">${['Low','Medium','High','Critical'].map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select><label>Assignee</label><select id="uass"><option value="">Unassigned</option>${staff.map(x=>`<option value="${x.id}" ${t.assignee?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="primary" style="margin-top:12px" onclick="saveTicket(${t.id})">Save changes</button>`:`<p class="muted">Assigned to: ${esc(t.assignee?.name||'Support queue')}</p>`}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Activity history</h3>${t.activities.map(a=>`<div class="activity"><b>${esc(a.action)}</b><small>${esc(a.actor)} · ${fmt(a.created_at)}</small></div>`).join('')||'<p class="muted">No activity yet.</p>'}<h3 style="margin-top:25px">Conversation</h3><div>${t.comments.map(c=>`<div class="card" style="padding:11px;margin:8px 0;background:#fafbfe"><b>${esc(c.author)}</b> <span class="muted">${fmt(c.created_at)}</span><div style="margin-top:6px;white-space:pre-wrap">${esc(c.body)}</div>${c.internal?'<small class="muted">Internal note</small>':''}</div>`).join('')||'<p class="muted">No comments yet.</p>'}</div><form id="commentForm" style="margin-top:12px"><textarea id="comment" rows="3" placeholder="Add a comment…" required></textarea>${state.user.role!=='student'?'<label style="display:flex;gap:7px;align-items:center"><input id="internal" type="checkbox" style="width:auto"> Internal staff note</label>':''}<button class="secondary" style="margin-top:8px">Add comment</button></form>`;$('commentForm').onsubmit=async e=>{e.preventDefault();await api('/api/tickets/'+id+'/comments',{method:'POST',body:{body:$('comment').value,internal:$('internal')?.checked||false}});toast('Comment added');openTicket(id)}}
async function saveTicket(id){await api('/api/tickets/'+id,{method:'PATCH',body:{status:$('ustatus').value,priority:$('upri').value,assignee_id:$('uass').value?+$('uass').value:null}});toast('Ticket updated');openTicket(id)}
function closeModal(){$('modal').style.display='none'}
function about(){$('main').innerHTML=`<div class="page-head"><div><h1>Product Notes</h1><div class="muted">Assignment 4 implementation overview</div></div></div><div class="content-grid"><div class="card"><h3>Workflow</h3><p>Student creates a ticket → staff assigns ownership → staff updates status/priority → conversation and activity history are preserved → ticket is resolved and closed.</p><h3>Hard rules implemented</h3><ul><li>Students can only see their own tickets.</li><li>Only staff/admin can assign, reprioritize or change status.</li><li>Internal notes are hidden from students.</li><li>Category SLA is applied at ticket creation.</li><li>Overdue active tickets are surfaced as SLA breached.</li></ul></div><div class="card"><h3>Engineering decisions</h3><ul><li>FastAPI REST API</li><li>SQLite for zero-configuration local evaluation</li><li>JWT session authentication</li><li>Role-based access control</li><li>Activity audit trail</li><li>Responsive single-page UI</li></ul><h3>Edge cases</h3><p>Invalid category, invalid role/assignee, unauthorized access, invalid status/priority, expired token and SLA breach are handled by the API.</p></div></div>`}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};boot();
</script></body></html>
